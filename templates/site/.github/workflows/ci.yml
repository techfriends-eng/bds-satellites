name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # bds-satellites публичный (решение автора 1a): ставится по тегу из package.json без токена.
      - run: npm install --no-audit --no-fund
      - run: npm run gate
      - name: shellcheck
        run: |
          files=$(git ls-files '*.sh' '.githooks/*')
          [ -z "$files" ] || shellcheck $files
      # gitleaks-action для репо организации требует платную лицензию — ставим бинарник.
      - name: gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz | tar -xz gitleaks
          ./gitleaks git . --redact --verbose --no-banner
