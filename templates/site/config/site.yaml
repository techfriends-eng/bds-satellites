# Конфиг __DOMAIN__ для bds-satellites (схема — src/lib/config/site.ts пакета). Ленты и курсы сайта — по списку источников в docs/ приватного репо сайта.
site: { id: __SITE__, domain: __DOMAIN__ }
# mode: site — спутник целиком; offers — только предложения bigdataschool.ru (ADR 0005 п. 5), без черновиков и WP.
mode: site

# brand обязателен: без него конфиг не разбирается. Предложение печатает ops/new-site.sh, подтверждает автор.
# Формат: brand: { primary: "#RRGGBB", accent: "#RRGGBB", background: "#RRGGBB", text: "#RRGGBB" }

topics: []

courses: []

# kind: blog | release | aggregator | youtube; topical — лента целиком по теме; enabled: false — выключен.
# youtube: { id: yt-<канал>, kind: youtube, title: ..., channel_id: UC... }; Shorts и митапы отсеет предотбор.
sources: []

select:
  maxAgeDays: 365
  keywords: [__SITE__]
  perRun: 2
  minRelevance: 7
  minDepth: 6
  maxFetches: 4
  # ADR 0005: от этих оценок кандидат сначала предлагается bigdataschool.ru (sat.bds_offers, карточка Stack Radar).
  bdsMinRelevance: 8
  bdsMinDepth: 6
  bdsPerRun: 3

llm:
  # Модель — строкой или списком с откатом по порядку: openrouter:<id> (или просто id), claude-cli:<alias>
  # (подписка Claude, RUNBOOK пакета §4), например review: [claude-cli:sonnet, anthropic/claude-sonnet-5.5].
  models:
    select: anthropic/claude-haiku-5.5
    plan: anthropic/claude-sonnet-5.5
    write: anthropic/claude-sonnet-5.5
    fix: anthropic/claude-sonnet-5.5
    review: anthropic/claude-sonnet-5.5
    revise: anthropic/claude-sonnet-5.5
    image: google/gemini-2.5-flash-image
    # Видео YouTube по ссылке, только OpenRouter (Gemini смотрит звук и экран).
    video: google/gemini-2.5-flash
  # У Claude 5 работает только effort (handbook gotchas/llm.md#claude5-reasoning).
  reasoning:
    select: { effort: low }
    plan: { effort: medium }
    write: { effort: medium }
    fix: { effort: medium }
    review: { effort: medium }
    revise: { effort: medium }
  maxCostPerRunUsd: 3
  # Потолок недели сайта (с 00:00 МСК schedule.day) для тактов; без ключа равен maxCostPerRunUsd.
  maxCostPerWeekUsd: 3

stand:
  base: /var/lib/bds-sat-__SITE__/runs
  maxFixes: 2
  images: []
  # pyRun: "docker compose exec -T <сервис> python3 /work/{file}"   # *.py в контейнере, если на хосте нет рантайма

gates: { minWords: 1500, maxWords: 2600, maxShingleShare: 0.15, maxRevisions: 2 }

publish:
  status: draft # future + lane 0..2 — автопубликация по расписанию (CHANGELOG 0.1.45)
  categories: []

schedule: { day: __DAY__ }
