name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:unit
      - run: npm run test:lint
      - run: npm run typecheck
      - run: npm run lint
      - name: shellcheck
        run: |
          files=$(git ls-files '*.sh' '.githooks/*')
          [ -z "$files" ] || shellcheck $files
      # gitleaks-action для репо организации требует платную лицензию — ставим бинарник.
      - name: gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz | tar -xz gitleaks
          ./gitleaks git . --redact --verbose --no-banner
