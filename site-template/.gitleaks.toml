# Правила gitleaks по умолчанию плюс правила по пути.
#
# Стандартные правила ищут секрет по контексту (`token = ...`, префикс ключа). Файл секрета,
# в котором лежит голое значение (secrets/bot_token), они не видят — так в wiki_visualizer
# 8 секретов прошли незамеченными. Поэтому сам путь считается находкой.
[extend]
useDefault = true

[[rules]]
id = "secret-file-path"
description = "Файл в папке secrets/ или ключ/сертификат — в git им не место"
path = '''(^|/)(secrets/[^/]+|[^/]+\.(pem|key|p12|pfx)|\.env(\.[^/]+)?)$'''

[allowlist]
description = "шаблоны env без значений"
paths = ['''(^|/)[^/]*\.env\.example$''']
